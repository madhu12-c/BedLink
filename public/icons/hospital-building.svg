<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <filter id="hosp-shadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="main-facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="wing-facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="glass-win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="roof-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <g filter="url(#hosp-shadow)">
    <!-- Base Foundation / Ground shadow plate -->
    <rect x="8" y="70" width="64" height="4" rx="2" fill="#94a3b8" opacity="0.6" />

    <!-- Left Wing (Slightly behind) -->
    <rect x="10" y="32" width="18" height="38" rx="2" fill="url(#wing-facade)" stroke="#64748b" stroke-width="1.2" />
    <!-- Left Wing Roof -->
    <rect x="9" y="30" width="20" height="3" rx="1" fill="#475569" />
    <!-- Left Wing Windows -->
    <rect x="13" y="36" width="5" height="6" rx="1" fill="url(#glass-win)" />
    <rect x="21" y="36" width="5" height="6" rx="1" fill="url(#glass-win)" />
    <rect x="13" y="46" width="5" height="6" rx="1" fill="url(#glass-win)" />
    <rect x="21" y="46" width="5" height="6" rx="1" fill="url(#glass-win)" />
    <rect x="13" y="56" width="5" height="6" rx="1" fill="url(#glass-win)" />
    <rect x="21" y="56" width="5" height="6" rx="1" fill="url(#glass-win)" />

    <!-- Right Wing (Slightly behind) -->
    <rect x="52" y="32" width="18" height="38" rx="2" fill="url(#wing-facade)" stroke="#64748b" stroke-width="1.2" />
    <!-- Right Wing Roof -->
    <rect x="51" y="30" width="20" height="3" rx="1" fill="#475569" />
    <!-- Right Wing Windows -->
    <rect x="55" y="36" width="5" height="6" rx="1" fill="url(#glass-win)" />
    <rect x="63" y="36" width="5" height="6" rx="1" fill="url(#glass-win)" />
    <rect x="55" y="46" width="5" height="6" rx="1" fill="url(#glass-win)" />
    <rect x="63" y="46" width="5" height="6" rx="1" fill="url(#glass-win)" />
    <rect x="55" y="56" width="5" height="6" rx="1" fill="url(#glass-win)" />
    <rect x="63" y="56" width="5" height="6" rx="1" fill="url(#glass-win)" />

    <!-- Main Tower Central Building -->
    <rect x="24" y="16" width="32" height="54" rx="2.5" fill="url(#main-facade)" stroke="#334155" stroke-width="1.4" />

    <!-- Main Tower Roof Coping -->
    <rect x="22" y="13" width="36" height="4" rx="1.5" fill="url(#roof-gradient)" stroke="#1e3a8a" stroke-width="1" />

    <!-- Helipad / Emergency Cross Badge Pedestal on Roof -->
    <rect x="30" y="6" width="20" height="8" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
    <!-- Bold Red Cross on Roof -->
    <path d="M 40 8 L 40 12 M 37 10 L 43 10" stroke="#dc2626" stroke-width="2.5" stroke-linecap="square" />

    <!-- Large Hospital 'H' & Red Cross Medallion on Upper Facade -->
    <circle cx="40" cy="25" r="5.5" fill="#ef4444" />
    <path d="M 40 21.5 L 40 28.5 M 36.5 25 L 43.5 25" stroke="#ffffff" stroke-width="2.2" stroke-linecap="square" />

    <!-- Main Tower Center Windows Grid -->
    <rect x="28" y="34" width="6.5" height="6.5" rx="1" fill="url(#glass-win)" stroke="#0284c7" stroke-width="0.5" />
    <rect x="36.5" y="34" width="7" height="6.5" rx="1" fill="url(#glass-win)" stroke="#0284c7" stroke-width="0.5" />
    <rect x="45.5" y="34" width="6.5" height="6.5" rx="1" fill="url(#glass-win)" stroke="#0284c7" stroke-width="0.5" />

    <rect x="28" y="44" width="6.5" height="6.5" rx="1" fill="url(#glass-win)" stroke="#0284c7" stroke-width="0.5" />
    <rect x="36.5" y="44" width="7" height="6.5" rx="1" fill="url(#glass-win)" stroke="#0284c7" stroke-width="0.5" />
    <rect x="45.5" y="44" width="6.5" height="6.5" rx="1" fill="url(#glass-win)" stroke="#0284c7" stroke-width="0.5" />

    <!-- Emergency Entrance Canopy (Red) -->
    <path d="M 31 56 L 49 56 L 48 60 L 32 60 Z" fill="#dc2626" />
    <text x="40" y="59.2" font-size="3" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="sans-serif" letter-spacing="0.5">EMERGENCY</text>

    <!-- Glass Sliding Doors at Entrance -->
    <rect x="34" y="60" width="12" height="10" fill="#0284c7" stroke="#334155" stroke-width="0.8" />
    <line x1="40" y1="60" x2="40" y2="70" stroke="#ffffff" stroke-width="0.8" />
    <rect x="36" y="62" width="3" height="7" fill="#bae6fd" opacity="0.6" />
    <rect x="41" y="62" width="3" height="7" fill="#bae6fd" opacity="0.6" />
  </g>
</svg>
